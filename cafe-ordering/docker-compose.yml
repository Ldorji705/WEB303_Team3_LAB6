services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe-postgres
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe_dev_password
      POSTGRES_DB: orders_db
    ports:
      - "5435:5432"
    volumes:
      - cafe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cafe-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://cafe:cafe_dev_password@postgres:5432/orders_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      PORT: "8082"
      PAYMENTS_DATABASE_URL: postgres://cafe:cafe_dev_password@postgres:5432/payments_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  kitchen-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: kitchen-service
    environment:
      PORT: "8083"
      KITCHEN_DATABASE_URL: postgres://cafe:cafe_dev_password@postgres:5432/kitchen_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    environment:
      PORT: "8084"
      NOTIFICATIONS_DATABASE_URL: postgres://cafe:cafe_dev_password@postgres:5432/notifications_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: nginx:alpine
    container_name: cafe-ui
    ports:
      - "8085:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - order-service
      - payment-service
      - kitchen-service
      - notification-service
    restart: unless-stopped

volumes:
  cafe_postgres_data:
